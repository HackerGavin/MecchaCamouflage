name: Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: microsoft/setup-msbuild@v2

      - name: Install Visual Studio Build Tools
        shell: powershell
        run: |
          .\scripts\build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Build
          path: release/**
        
